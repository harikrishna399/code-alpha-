name: Validate sample datasets and Power BI project sources

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate CSV structure and basic ranges
        run: python scripts/validate_data.py
      - name: Validate PBIP JSON, embedded data, model tables, relationships and visuals
        run: python scripts/validate_powerbi_projects.py
