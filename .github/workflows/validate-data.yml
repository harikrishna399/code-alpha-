name: Validate CodeAlpha Power BI project sources

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-data-and-pbip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate datasets and financial arithmetic
        run: python scripts/validate_data.py
      - name: Validate Power BI project source structure
        run: python scripts/validate_powerbi_projects.py
